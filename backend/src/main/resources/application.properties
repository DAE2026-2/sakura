spring.application.name=sakura-backend
server.port=8080

# Perfil por defecto: H2 en memoria con datos de ejemplo. Con Supabase: --spring.profiles.active=supabase
spring.profiles.default=local

# Credenciales de Supabase, fuera del repositorio (ver .env.example).
spring.config.import=optional:file:.env[.properties]

spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# Reglas del restaurante
sakura.zona-horaria=America/Bogota
sakura.reservas.max-personas=8
sakura.reservas.dias-antelacion=60
sakura.reservas.minutos-antes=30
sakura.reservas.minutos-despues=15
sakura.reservas.duracion-minutos=120
sakura.cors.origenes=http://localhost:4321
