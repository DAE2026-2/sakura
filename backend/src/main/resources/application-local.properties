# Base de datos local en memoria: se crea al arrancar y se llena con data-local.sql. Se pierde al parar.
spring.datasource.url=jdbc:h2:mem:sakura;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-local.sql
